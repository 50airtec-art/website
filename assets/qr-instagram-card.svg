<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="30mm" height="36mm"
     viewBox="0 0 30 36">

  <defs>
    <linearGradient id="igGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FFDC80"/>
      <stop offset="25%" stop-color="#FCAF45"/>
      <stop offset="50%" stop-color="#F77737"/>
      <stop offset="75%" stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#833AB4"/>
    </linearGradient>
  </defs>

  <!-- グラデーション枠 -->
  <rect x="0.5" y="0.5" width="29" height="35"
        rx="4" ry="4"
        fill="none"
        stroke="url(#igGrad)"
        stroke-width="1"/>

  <!-- 白い内側 -->
  <rect x="2" y="2" width="26" height="32" rx="2.5" fill="#ffffff"/>

  <!-- QRコード -->
  <image href="qr-instagram-pink.png" x="4" y="4" width="22" height="22"/>

  <!-- 区切り線 -->
  <line x1="6" y1="27.5" x2="24" y2="27.5" stroke="url(#igGrad)" stroke-width="0.3"/>

  <!-- Instagram ラベル -->
  <text x="15" y="30.5"
        font-family="'Inter','Helvetica Neue',sans-serif"
        font-size="2.2"
        font-weight="700"
        fill="#E1306C"
        text-anchor="middle"
        letter-spacing="0.3">INSTAGRAM</text>

  <!-- アカウント名 -->
  <text x="15" y="33.2"
        font-family="'Inter','Helvetica Neue',sans-serif"
        font-size="1.9"
        font-weight="500"
        fill="#5A6068"
        text-anchor="middle"
        letter-spacing="0.2">@50airtec</text>

</svg>
