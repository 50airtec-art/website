<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="91mm" height="55mm"
     viewBox="0 0 91 55">

  <!-- Background -->
  <rect width="91" height="55" fill="#ffffff"/>

  <!-- Logo mark (small, top-left) -->
  <image href="logo-mark.png" x="6" y="6" width="11" height="11"/>

  <!-- Brand text (right of logo) -->
  <g font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
    <text x="20" y="12" font-size="3.6" font-weight="700" fill="#1A1D21" letter-spacing="0.2">50Airtec</text>
    <text x="20" y="15.8" font-size="1.8" font-weight="400" fill="#5A6068" letter-spacing="1.0">ゴーマルエアテック</text>
  </g>

  <!-- Divider -->
  <line x1="6" y1="22" x2="85" y2="22" stroke="#E5E7EA" stroke-width="0.25"/>

  <!-- Thank you headline -->
  <text x="45.5" y="32"
        font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif"
        font-size="6"
        font-weight="700"
        fill="#1A1D21"
        text-anchor="middle"
        letter-spacing="0.6">この度はありがとう</text>
  <text x="45.5" y="40"
        font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif"
        font-size="6"
        font-weight="700"
        fill="#1A1D21"
        text-anchor="middle"
        letter-spacing="0.6">ございました。</text>

  <!-- Signature -->
  <text x="45.5" y="48"
        font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif"
        font-size="2.6"
        font-weight="500"
        fill="#5A6068"
        text-anchor="middle"
        letter-spacing="0.4">50Airtec 代表  五十嵐 透</text>

</svg>
