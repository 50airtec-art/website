<p class="note">
  ボタンを押すとPNGが自動ダウンロードされます。<br>
  保存先はブラウザのダウンロードフォルダ（通常: <code>C:\Users\toooo\Downloads\</code>）。<br>
  そのPNGをCanvaに直接アップロードしてご利用ください。
</p>

<script>
function downloadPNG(wrapId, filename, widthMm, heightMm) {
  const dpi = parseInt(document.getElementById('dpi').value) || 300;
  const pxPerMm = dpi / 25.4;
  const widthPx = Math.round(widthMm * pxPerMm);
  const heightPx = Math.round(heightMm * pxPerMm);

  const svgEl = document.querySelector('#' + wrapId + ' svg');
  const svgClone = svgEl.cloneNode(true);
  svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  svgClone.setAttribute('width', widthMm + 'mm');
  svgClone.setAttribute('height', heightMm + 'mm');
  const svgStr = new XMLSerializer().serializeToString(svgClone);
  const svgBlob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);

  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = widthPx;
    canvas.height = heightPx;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, widthPx, heightPx);
    ctx.drawImage(img, 0, 0, widthPx, heightPx);
    canvas.toBlob(function(blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename + '_' + dpi + 'dpi.png';
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  };
  img.onerror = function(e) {
    alert('変換に失敗しました');
    console.error(e);
  };
  img.src = url;
}
</script>
