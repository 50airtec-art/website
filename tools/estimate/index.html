<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>空調王</title>

<!-- ホーム画面に追加できるようにする。
     iPhoneのSafariは「7日間そのサイトを開かないと、保存した中身を消す」決まりがある。
     ホーム画面から開くアプリはその決まりの外に置かれるので、消えない。
     入れた見積を守るための仕込みであって、見た目の話ではない。 -->
<link rel="manifest" href="manifest.json?v=202609122100">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black-translucent にすると、時計や電池の下に画面が潜り込んで
     いちばん上のタブ（見積作成・現場…）が隠れる。default なら隠れない -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="空調王">
<meta name="theme-color" content="#1a1a1a">
<link rel="apple-touch-icon" href="icon-180.png?v=202609122100">
<link rel="icon" href="icon-192.png?v=202609122100">

<!-- ======================================================================
     ここは「入口」です。空調王の中身はここにはありません。

     空調王を月額で売るために、二つに割りました（[[project-kuchoo-lock]]）。

       入口（このファイル）… 誰でも読める。本体を呼びに行くだけ
       本体（bundle.js）  … 画面・見た目・中身ぜんぶ

     いまはまだ鍵をかけていません。bundle.js をそのまま読みに行きます。
     動きも見た目も、割る前とまったく同じです。

     本体は build.mjs が組み立てます。**bundle.js を手で直さないこと。**
       cd tools\estimate
       node build.mjs
     ====================================================================== -->
<style>
  /* 入口の見た目だけ。本体の style.css は、本体が来てから流し込みます。

     ★ ここの指定は #kuchoo-boot の中だけに閉じてあります。
       body に色や字を指定してしまうと、本体が来たあとや、
       印刷したときに、思わぬところへ効いてしまうからです。
       消していいのは margin だけ（本体の style.css も同じことをしています）。 */
  html, body { margin: 0; padding: 0; }
  #kuchoo-boot {
    min-height: 100svh; display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #f6f6f4; color: #1a1a1a;
  }
  #kuchoo-boot .boot-card { max-width: 30rem; width: 100%; text-align: center; }
  #kuchoo-boot .boot-mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 3rem; height: 3rem; border-radius: .75rem;
    background: #1a1a1a; color: #fff; font-weight: 700; font-size: 1rem;
    letter-spacing: .05em;
  }
  #kuchoo-boot .boot-name { margin: .75rem 0 .25rem; font-size: 1.25rem; font-weight: 700; }
  #kuchoo-boot .boot-msg  { margin: 0; color: #666; font-size: .9rem; line-height: 1.7; }
  #kuchoo-boot .boot-card.is-error .boot-mark { background: #9a2b2b; }
  #kuchoo-boot .boot-card.is-error .boot-msg  { color: #9a2b2b; }
  #kuchoo-boot .boot-retry {
    margin-top: 1rem; padding: .6rem 1.2rem; font: inherit; font-size: .9rem;
    border: 1px solid #ccc; border-radius: .5rem; background: #fff; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    #kuchoo-boot { background: #15161a; color: #e9e9ea; }
    #kuchoo-boot .boot-msg { color: #a0a0a6; }
    #kuchoo-boot .boot-retry { background: #24262c; border-color: #3a3d45; color: inherit; }
  }
</style>
</head>
<body>

<div id="kuchoo-boot">
  <div class="boot-card" id="boot-card">
    <span class="boot-mark" id="boot-mark">空調</span>
    <p class="boot-name">空調王</p>
    <p class="boot-msg" id="boot-msg">読み込んでいます…</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  var V = '202609122100';
  var card = document.getElementById('boot-card');
  var msg  = document.getElementById('boot-msg');

  function fail(text, detail) {
    card.className = 'boot-card is-error';
    document.getElementById('boot-mark').textContent = '！';
    msg.innerHTML = text;
    if (detail) { try { console.error('[空調王]', detail); } catch (e) {} }
    var b = document.createElement('button');
    b.className = 'boot-retry'; b.type = 'button'; b.textContent = 'もう一度ためす';
    b.addEventListener('click', function () { location.reload(); });
    card.appendChild(b);
  }

  /* ------------------------------------------------------------------
     本体を画面に組み上げる。
     順番が大事。**画面（html）を先に置いてから、中身（js）を動かす。**
     app.js は読み込まれたその場で #… を探しにいくので、
     先に置いておかないと「そんな部品はない」で止まる。
     ------------------------------------------------------------------ */
  function mount(bundle) {
    try {
      // 1. 見た目
      var st = document.createElement('style');
      st.setAttribute('data-kuchoo', 'sheet');
      st.textContent = bundle.css;
      document.head.appendChild(st);

      // 2. 画面。読み込み中の札を消してから入れる
      var boot = document.getElementById('kuchoo-boot');
      if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
      document.body.insertAdjacentHTML('afterbegin', bundle.html);

      // 3. 中身。1本ずつ、もとの <script> と同じ順番で走らせる
      bundle.js.forEach(function (pair) {
        var s = document.createElement('script');
        s.setAttribute('data-kuchoo', pair[0]);
        s.textContent = pair[1];
        document.body.appendChild(s);
      });
    } catch (e) {
      fail('空調王をひらけませんでした。<br>電波のよいところで、もう一度ためしてください。', e);
    }
  }

  /* 本体が自分を渡してくる窓口（bundle.js の最後の1行が、これを呼ぶ） */
  var came = false;
  window.__KUCHOO_BUNDLE__ = function (bundle) {
    came = true;
    if (!bundle || !bundle.html || !bundle.js) {
      fail('本体がこわれています。<br>お手数ですが、ご連絡ください。');
      return;
    }
    mount(bundle);
  };

  /* ------------------------------------------------------------------
     本体を呼びに行く。

     ★ いまは鍵をかけていません。同じ場所の bundle.js をそのまま読みます。
       ここを「クラウドに聞きに行く」に差し替えるのが、次の段階です。
     ------------------------------------------------------------------ */
  var sc = document.createElement('script');
  sc.src = 'bundle.js?v=' + V;
  sc.onerror = function () {
    fail('空調王の本体が読み込めませんでした。<br>電波のよいところで、もう一度ためしてください。');
  };
  sc.onload = function () {
    // 読めたのに窓口が呼ばれない＝中身が壊れている
    if (!came) fail('本体がこわれています。<br>お手数ですが、ご連絡ください。');
  };
  document.head.appendChild(sc);
})();
</script>

</body>
</html>
